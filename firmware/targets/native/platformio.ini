; Native (host) target -- builds the safety firmware as a Linux/macOS binary.
;
; Two board modes are provided so either controller can be emulated:
;   native_oev6 - OpenEVSE v3 / OEV6, 10-bit ADC, 10-byte MCU id
;   native_nxt  - OpenEVSE NXT (SAMD), 12-bit ADC, 16-byte MCU id
;
; RAPI is on stdin/stdout for now, so the firmware can be driven with a pipe:
;   echo '$GV*C1' | .pio/build/native_oev6/program
;
; n.b. the flag split is deliberate. build_flags reaches EpoxyDuino as well as
; the firmware, and the core selector must, or EpoxyDuino's own sources compile
; without RISING/OUTPUT/D0. The firmware's feature flags stay in build_src_flags
; so they do not leak into library code.

[native]
lib_deps = ${common.lib_deps}
  https://github.com/jeremypoulter/EpoxyDuino.git#fix/delay-services-interrupts
build_flags =
  -std=gnu++14
  -fpermissive
  -Wno-narrowing
  -D ARDUINO=100
  -D EPOXY_DUINO
  -D EPOXY_CORE_AVR
  -D UNIX_HOST_DUINO
build_src_flags =
  -D TARGET_NATIVE
  -D RAPI_SERIAL_PORT=Serial
  -I firmware/targets/native
build_src_filter =
  ${common.build_src_filter}
  +<../targets/native>
lib_compat_mode = off
; EpoxyDuino ships ESP-flavoured mocks alongside the core; none apply to the
; safety firmware and EpoxyMockWiFi pulls in ESP-only headers.
lib_ignore =
  EpoxyMockWiFi
  EpoxymDNS
  EpoxyFS
  EpoxyEepromEsp
  EpoxyEepromAvr
  EpoxyMockFastLED
  EpoxyMockTimerOne
  EpoxyMockSTM32RTC

# OpenEVSE v3 / OEV6
[env:native_oev6]
platform = native
lib_deps = ${native.lib_deps}
lib_compat_mode = ${native.lib_compat_mode}
lib_ignore = ${native.lib_ignore}
build_type = debug
build_flags = ${native.build_flags}
build_src_filter = ${native.build_src_filter}
build_src_flags =
  ${native.build_src_flags}
  ${common.build_flags}
  -D OEV6
  -D 'VERSION="${common.version}.native"'

# OpenEVSE NXT (SAMD-equivalent)
[env:native_nxt]
platform = native
lib_deps = ${native.lib_deps}
lib_compat_mode = ${native.lib_compat_mode}
lib_ignore = ${native.lib_ignore}
build_type = debug
build_flags = ${native.build_flags}
build_src_filter = ${native.build_src_filter}
build_src_flags =
  ${native.build_src_flags}
  ${common.build_flags}
  -D NATIVE_BOARD_NXT
  -D RELAY_ZC_SWITCH
  -D 'VERSION="${common.version}.native.nxt"'
